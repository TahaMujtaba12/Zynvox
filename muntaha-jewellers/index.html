<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Muntaha Jewellers, POS & Management (Demo by Zynvox)</title>
<meta name="description" content="Working demo by Zynvox: jewellery POS and shop management for gold, silver and diamond jewellers in Pakistan. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#4a1520;--velvet2:#5f1c29;--velvet3:#732535;
  --gold:#b0852b;--gold2:#d4ab55;--gold-soft:#f7efdd;
  --bg:#f1f2f4;--paper:#ffffff;--ink:#1b1a1d;--ink2:#46434b;--mute:#77737d;--line:#e1dfe4;--wash:#f7f7f9;
  --ok:#1d8a5b;--ok-soft:#e1f3ea;--warn:#a86a07;--warn-soft:#fbefd9;--bad:#b4362f;--bad-soft:#f8e2e0;--blue:#2b5fa8;--blue-soft:#e3ecf8;
  --display:'Marcellus',Georgia,serif;--body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.urdu{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting',serif;direction:rtl}
h1,h2,h3{margin:0;font-weight:600}
.demo{background:#26090f;color:#e8c9cf;font-size:12.5px;text-align:center;padding:7px 12px}
.demo b{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--velvet);border-color:var(--velvet);color:#fff}
.btn.pri:hover{background:var(--velvet2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#ecc4c0}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%}
.inp{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 11px}
.inp:focus{outline:2px solid color-mix(in srgb,var(--gold) 40%,transparent);border-color:var(--gold)}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-weight:700;font-size:12.5px;color:var(--ink2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--wash);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.c-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.c-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.c-blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}.c-gold{background:var(--gold-soft);color:#7d5a12;border-color:transparent}
.err{color:var(--bad);font-size:12.5px}

/* Shell */
.shell{display:grid;grid-template-columns:228px 1fr;min-height:calc(100vh - 32px)}
.rail{background:var(--velvet);color:#e8d4d8;padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .mk{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold2);display:grid;place-items:center;font-family:var(--display);color:var(--gold2);font-size:19px}
.brand b{display:block;font-family:var(--display);color:#fff;font-size:18px;font-weight:400;letter-spacing:.02em}
.brand small{color:#c9a6ad;font-size:11.5px}
.nav button{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;color:#e0c5ca;padding:9px 10px;border-radius:9px;font-weight:600;text-align:left;font-size:14px}
.nav button:hover{background:var(--velvet2);color:#fff}
.nav button[aria-current="page"]{background:var(--velvet3);color:#fff;box-shadow:inset 3px 0 0 var(--gold2)}
.nav svg{width:18px;height:18px;flex:none}
.nav .grp{color:#b48b93;font-size:11.5px;font-weight:700;padding:12px 10px 4px}
.rail .foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid #6a2633;font-size:12px;color:#c9a6ad}
.top{position:sticky;top:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:400;font-size:24px}
.top .sp{flex:1}
.ratebar{display:flex;gap:6px;flex-wrap:wrap}
.rate{border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:12px;background:var(--wash);line-height:1.25}
.rate b{display:block;font-size:13.5px}
.rate.g{border-color:#ead7ab;background:var(--gold-soft)}
.menu{display:none}
.page{padding:20px 22px 70px;max-width:1300px}
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .rail.open{transform:none}
  .menu{display:inline-flex}
  .top{padding:10px 14px}.page{padding:14px 14px 70px}
  .ratebar{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap}
}
.scrim{position:fixed;inset:0;background:rgba(30,8,12,.4);z-index:35}

/* Cards & tables */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h2{font-size:16px;font-weight:800}
.panel .sub{color:var(--mute);font-size:13px;margin:2px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--mute);font-weight:700;font-size:12px}
.kpi b{display:block;font-size:22px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.two.even{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.two,.two.even{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--wash);color:var(--mute);font-size:12px;font-weight:700}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .inp{max-width:250px}
.toolbar select.inp{max-width:170px}
.toolbar .sp{flex:1}
.empty{text-align:center;color:var(--mute);padding:26px}

/* Sarafa board */
.board{background:var(--velvet);color:#f3e3e6;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:800px){.board{grid-template-columns:1fr}}
.board h2{font-family:var(--display);font-weight:400;font-size:22px;color:#fff}
.board .sub{color:#d2acb3;font-size:12.5px}
.btable{width:100%;border-collapse:collapse;margin-top:10px}
.btable td,.btable th{border-bottom:1px solid #6a2633;padding:7px 4px;font-size:13.5px;color:#f3e3e6}
.btable th{background:none;color:#c9a6ad;font-weight:700;font-size:12px}
.btable td.big{font-size:17px;font-weight:800;color:var(--gold2)}
.spark svg{width:100%;height:130px;display:block}

/* POS */
.pos{display:grid;grid-template-columns:1fr 410px;gap:14px;align-items:start}
@media(max-width:1100px){.pos{grid-template-columns:1fr}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.item:hover{border-color:var(--gold)}
.item[disabled]{opacity:.45}
.item .pic{height:74px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold-soft),#fff)}
.item .pic.s{background:linear-gradient(135deg,#eceef2,#fff)}
.item .pic.d{background:linear-gradient(135deg,#e6eef8,#fff)}
.item .pic svg{width:44px;height:44px}
.item b{font-size:13.5px;line-height:1.25}
.item small{color:var(--mute);font-size:12px}
.item .pr{font-weight:800;font-size:14px}
.cart{background:var(--paper);border:1px solid var(--line);border-radius:14px;position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.cart .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
.cart .bd{padding:10px 14px;overflow-y:auto;flex:1}
.cart .ft{padding:12px 14px;border-top:1px solid var(--line);background:var(--wash);border-radius:0 0 14px 14px}
.line{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.line .t{display:flex;justify-content:space-between;gap:8px}
.line .t b{font-size:13.5px}
.break{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;color:var(--ink2);margin-top:6px}
.break .r{text-align:right}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.tot .r{text-align:right}
.tot .g{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.weigh{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.weigh .inp{padding:6px 8px;text-align:center}
.weigh label{font-size:11.5px;color:var(--mute);font-weight:700;text-align:center;display:block}

/* Orders kanban */
.kan{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1000px){.kan{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.kan{grid-template-columns:1fr}}
.col{background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col h3{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
.oc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;font-size:13px}
.oc b{display:block;font-size:13.5px}
.oc small{color:var(--mute);display:block}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(30,8,12,.45);display:grid;place-items:center;padding:14px;z-index:50}
.mbox{background:var(--paper);border-radius:16px;width:100%;max-width:520px;padding:20px;max-height:calc(100vh - 28px);overflow:auto;box-shadow:0 30px 80px rgba(30,8,12,.35)}
.mbox.wide{max-width:760px}
.mbox h3{font-size:19px;font-weight:800;margin-bottom:2px}
.mbox .sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;justify-items:center}
.toast{background:var(--velvet);color:#fff;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(30,8,12,.3)}

/* Invoice */
.inv{border:1px solid var(--line);border-radius:12px;padding:18px;font-size:13px}
.inv .ih{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:10px}
.inv .ih h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--velvet)}
.inv table th{background:var(--gold-soft);color:#5e430c}
.inv .fb{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.tag{width:250px;border:1px dashed var(--mute);border-radius:8px;padding:10px;font-size:12px;background:#fff}
.bars{display:flex;height:34px;gap:1px;margin:6px 0}
.bars i{background:#111;flex:none}

.shell>div,.two>*,.board>*,.pos>*,.kpis>*{min-width:0}
td.num,td .num,.inv td.r{white-space:nowrap}
.rate{white-space:nowrap;flex:none}
@media(min-width:961px){.top{flex-wrap:nowrap}.top h1{white-space:nowrap;flex:none}.ratebar{flex:0 1 auto;min-width:0}.top .sp{flex:1 1 0;min-width:0}#role{flex:none}}
@media(min-width:961px) and (max-width:1250px){.rate{padding:3px 7px;font-size:11px}.top h1{font-size:21px}}
.mbox.wide{max-width:900px}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr}
  .btable th:nth-child(3),.btable td:nth-child(3){display:none}
  .btable td.big{font-size:15px}
  .grid2{grid-template-columns:1fr}
  .top h1{font-size:20px}
  .inv .ih{flex-direction:column}
}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>
<body>
<div class="demo"><b>Working demo by Zynvox.</b> Sample data only. Gold and silver rates are example figures, not today's market rates.</div>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand"><div class="mk">M</div><div><b>Muntaha Jewellers</b><small>Gold, silver &amp; diamond</small></div></div>
    <nav class="nav" id="nav">
      <button data-v="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button data-v="pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>New sale (POS)</button>
      <div class="grp">Stock</div>
      <button data-v="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Inventory &amp; tags</button>
      <button data-v="exchange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg>Old gold &amp; buyback</button>
      <button data-v="memo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h10v18l-5-3-5 3z"/></svg>Memo &amp; consignment</button>
      <button data-v="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>Stock audit (RFID)</button>
      <button data-v="rates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>Daily rates</button>
      <div class="grp">Work</div>
      <button data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Orders &amp; repairs</button>
      <button data-v="karigar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6Z"/></svg>Karigar</button>
      <div class="grp">Money</div>
      <button data-v="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>Customers &amp; khata</button>
      <button data-v="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-4-6-1s6 1 6 1Zm0 0c2-4 6-4 6-1s-6 1-6 1Z"/></svg>Plans, schemes &amp; gifts</button>
      <button data-v="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cash book</button>
      <button data-v="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</button>
      <div class="grp">Tools</div>
      <button data-v="zakat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M9 12h6M12 9v6"/></svg>Weight calculator</button>
      <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15.1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Settings</button>
    </nav>
    <div class="foot">Logged in as <b id="whoami" style="color:#fff">Owner</b><br>Demo build by Zynvox</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div>
    <header class="top">
      <button class="btn menu" id="menuBtn" aria-label="Open menu">☰</button>
      <h1 id="ttl">Dashboard</h1>
      <div class="ratebar" id="ratebar"></div>
      <span class="sp"></span>
      <select class="inp" id="role" style="width:auto" aria-label="Switch user role"><option value="owner">Owner</option><option value="sales">Salesman</option><option value="acct">Accountant</option></select>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="printArea" hidden></div>

<script>
/* ================= Units & money ================= */
const TOLA = 11.6638, MASHA = TOLA / 12, RATTI = MASHA / 8;
const PUR = { '24K': 1, '22K': 0.916, '21K': 0.875, '18K': 0.75 };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => 'Rs ' + Math.round(n).toLocaleString('en-IN');
const g2 = n => (+n).toFixed(3).replace(/\.?0+$/, '') + ' g';
function tmr(g) { let t = Math.floor(g / TOLA), r = g - t * TOLA, m = Math.floor(r / MASHA); r -= m * MASHA; const ra = Math.round(r / RATTI); return { t, m, r: ra }; }
const tmrStr = g => { const x = tmr(g); return `${x.t} tola ${x.m} masha ${x.r} ratti`; };
const today = () => new Date().toISOString().slice(0, 10);
const fdate = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

/* ================= Pricing engine ================= */
function perGram(metal, karat) { if (metal === 'silver') return S.rate.silver / TOLA; if (metal === 'platinum') return S.rate.platinum / TOLA; return S.rate['24K'] / TOLA * (PUR[karat] || 1); }
function rateTola(k) { return k === 'silver' ? S.rate.silver : k === 'PT950' ? S.rate.platinum : S.rate['24K'] * PUR[k]; }
const net = it => Math.max(0, it.gross - it.stone);
function itemPrice(it, raw) {
  const w = net(it), metalV = w * perGram(it.metal, it.karat);
  let making = it.mType === 'g' ? w * it.mVal : it.mType === 'pct' ? metalV * it.mVal / 100 : it.mVal;
  const stones = (it.stones || []).reduce((a, s) => a + (s.perCt ? s.ct * s.perCt : s.price || 0), 0);
  const sub = metalV + making + stones, tax = raw ? 0 : sub * S.set.taxPct / 100;
  return { metalV, making, stones, tax, total: sub + tax, w };
}

function spark(vals, col) {
  const W = 400, H = 130, P = 6, mx = Math.max(...vals), mn = Math.min(...vals), x = i => P + i * (W - 2 * P) / (vals.length - 1), y = v => H - P - (v - mn) / ((mx - mn) || 1) * (H - 2 * P - 14);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Rate trend"><path d="${d} L${x(vals.length - 1)} ${H} L${x(0)} ${H}Z" fill="${col}" fill-opacity=".14"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg><div class="row" style="justify-content:space-between;font-size:12px;color:#d2acb3"><span>Low ${rs(mn)}</span><span>High ${rs(mx)}</span></div>`;
}

/* ================= Old gold ================= */
function oldValue(wt, karat, tested, ded, metal) { const purity = metal === 'silver' ? 1 : (tested ? tested / 100 : PUR[karat]); const base = metal === 'silver' ? S.rate.silver / TOLA : S.rate['24K'] / TOLA; return wt * base * purity * (1 - ded / 100); }
function oldGoldModal(forSale) {
  modal(`<h3>${forSale ? 'Adjust old gold in this bill' : 'Buy old gold'}</h3><p class="sub">Weigh the piece, test purity, apply the shop's deduction.</p>
  <div class="grid2"><div class="field"><label for="og-m">Metal</label><select class="inp" id="og-m"><option value="gold">Gold</option><option value="silver">Silver</option></select></div><div class="field"><label for="og-k">Karat (as claimed)</label><select class="inp" id="og-k"><option>22K</option><option>21K</option><option>18K</option><option>24K</option></select></div></div>
  <div class="grid3"><div class="field"><label for="og-w">Weight (g)</label><input class="inp num" id="og-w" type="number" step="0.01" min="0" value="10"></div><div class="field"><label for="og-t">Tested purity %</label><input class="inp num" id="og-t" type="number" step="0.1" min="0" max="100" placeholder="e.g. 91.6"></div><div class="field"><label for="og-d">Deduction %</label><input class="inp num" id="og-d" type="number" step="0.5" min="0" value="${S.set.oldDed}"></div></div>
  ${forSale ? '' : `<div class="grid2"><div class="field"><label for="og-c">Customer</label><select class="inp" id="og-c"><option value="">Walk-in</option>${S.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="og-p">Pay as</label><select class="inp" id="og-p"><option>Cash</option><option>Store credit</option></select></div></div>`}
  <div class="panel" style="background:var(--gold-soft);border-color:#ead7ab"><div class="break" id="og-b" style="font-size:13.5px"></div></div>
  <div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="og-ok">${forSale ? 'Adjust in bill' : 'Pay customer and add to old gold stock'}</button></div>`);
  const calc = () => { const m = $('#og-m').value, w = +$('#og-w').value || 0, t = +$('#og-t').value || 0, d = +$('#og-d').value || 0, k = $('#og-k').value; const v = oldValue(w, k, t, d, m); const pur = m === 'silver' ? 100 : (t || PUR[k] * 100); $('#og-b').innerHTML = `<span>Weight</span><span class="r num">${g2(w)} (${tmrStr(w)})</span><span>Purity used</span><span class="r num">${pur.toFixed(1)}%</span><span>Pure ${m} equivalent</span><span class="r num">${g2(w * pur / 100)}</span><span>Deduction</span><span class="r num">${d}%</span><span><b>Value to customer</b></span><span class="r num"><b>${rs(v)}</b></span>`; return { m, w, t, d, k, v }; };
  ['og-m', 'og-k', 'og-w', 'og-t', 'og-d'].forEach(id => $('#' + id).oninput = calc); calc();
  $('#og-ok').onclick = () => { const x = calc(); if (x.w <= 0) { toast('Enter the weight'); return; } const rec = { id: 'OG-' + (78 + S.oldgold.length), date: today(), cust: forSale ? (custName(S.cartCust)) : custName($('#og-c').value), wt: x.w, karat: x.m === 'silver' ? 'Silver' : x.k, tested: x.t || (x.m === 'silver' ? 100 : PUR[x.k] * 100), ded: x.d, value: Math.round(x.v) };
    if (forSale) { S.oldAdj = (S.oldAdj || 0) + rec.value; S.pendingOld = rec; close(); renderCart(); toast(`${rs(rec.value)} old gold adjusted`); }
    else if ($('#og-p').value === 'Store credit') { const cu = S.customers.find(c => c.id === $('#og-c').value); if (!cu) { toast('Choose a customer to give store credit'); return; } rec.mode = 'Store credit'; S.oldgold.unshift(rec); cu.credit = (cu.credit || 0) + rec.value; close(); vExchange(); toast(`${rs(rec.value)} added to ${cu.name}'s store credit`); } else { rec.mode = 'Bought for cash'; S.oldgold.unshift(rec); S.cash.push({ date: today(), desc: `Old gold bought ${rec.id}`, inn: 0, out: rec.value }); close(); vExchange(); toast(`Paid ${rs(rec.value)}. Added to old gold stock.`); } };
}
function vExchange() {
  const tot = S.oldgold.reduce((a, o) => a + o.wt, 0);
  $('#page').innerHTML = `<div class="kpis"><div class="kpi"><small>Old gold collected</small><b class="num">${g2(tot)}</b><span>${tmrStr(tot)}</span></div><div class="kpi"><small>Default deduction</small><b class="num">${S.set.oldDed}%</b><span>Change in settings</span></div><div class="kpi"><small>Transactions</small><b class="num">${S.oldgold.length}</b><span>Exchanged or bought</span></div><div class="kpi"><small>Send to refiner</small><b class="num">${g2(tot)}</b><span>Ready to melt</span></div></div>
  <div class="toolbar"><span class="sub" style="color:var(--mute)">Old gold taken in exchange during a sale is added from the POS bill.</span><span class="sp"></span><button class="btn pri" id="buyOld">Buy old gold</button></div>
  <div class="tw"><table><thead><tr><th>Ref</th><th>Date</th><th>From</th><th>Metal</th><th class="r">Weight</th><th class="r">Purity</th><th class="r">Deduction</th><th class="r">Value</th><th>Mode</th></tr></thead><tbody>
  ${S.oldgold.map(o => `<tr><td><b>${o.id}</b></td><td>${fdate(o.date)}</td><td>${esc(o.cust)}</td><td>${o.karat}</td><td class="r num">${g2(o.wt)}</td><td class="r num">${(+o.tested).toFixed(1)}%</td><td class="r num">${o.ded}%</td><td class="r num">${rs(o.value || oldValue(o.wt, o.karat, o.tested, o.ded, 'gold'))}</td><td><span class="chip ${o.mode === 'Exchanged' ? 'c-gold' : 'c-blue'}">${o.mode}${o.inv ? ', ' + o.inv : ''}</span></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#buyOld').onclick = () => oldGoldModal(false);
}

  <div class="kan">${STAGES.map(st => `<div class="col"><h3><span>${st}</span><span class="chip">${S.orders.filter(o => o.stage === st).length}</span></h3>${S.orders.filter(o => o.stage === st).map(o => { const late = o.stage !== 'Delivered' && new Date(o.due) < new Date(today()); return `<div class="oc"><div class="row" style="justify-content:space-between"><b>${o.id}</b><span class="chip ${o.type === 'Repair' ? 'c-blue' : 'c-gold'}">${o.type}</span></div><span>${esc(o.desc)}</span><small>${esc(custName(o.cust))}</small><small>${o.karat}, about ${g2(o.estWt)}, karigar ${esc((S.karigars.find(k => k.id === o.karigar) || {}).name || 'none')}</small><small style="color:${late ? 'var(--bad)' : 'var(--mute)'}">Due ${fdate(o.due)}${late ? ' (late)' : ''}</small>${o.quote ? `<small>Quote ${rs(o.quote)}${o.cad ? `, CAD ${rs(o.cad)}` : ''}${o.wax ? `, wax ${o.wax} g` : ''}</small>` : ''}${o.advCash ? `<small>Advance ${rs(o.advCash)}</small>` : ''}${st !== 'Delivered' ? `<div class="row" style="margin-top:6px"><button class="btn sm" data-adv="${o.id}">Move to ${STAGES[STAGES.indexOf(st) + 1]}</button><button class="btn sm" data-owa="${o.id}">WhatsApp</button></div>` : ''}</div>`; }).join('') || '<p class="sub" style="font-size:12.5px">Nothing here.</p>'}</div>`).join('')}</div>`;
  $('#newOrd').onclick = () => orderModal('Custom'); $('#newRep').onclick = () => orderModal('Repair');

  $$('[data-owa]').forEach(b => b.onclick = () => { const o = S.orders.find(x => x.id === b.dataset.owa); toast(`Status update for ${o.id} sent to ${custName(o.cust)} (demo)`); });
}

/* ================= Karigar ================= */
function vKarigar() {
  $('#page').innerHTML = `<div class="kpis">${S.karigars.map(k => { const open = S.kissue.filter(i => i.karigar === k.id && i.status === 'Open'); const wt = open.reduce((a, i) => a + i.issued, 0); return `<div class="kpi"><small>${esc(k.name)}, ${esc(k.skill)}</small><b class="num">${g2(wt)}</b><span>Gold with karigar, ${open.length} open job${open.length === 1 ? '' : 's'}. Wastage allowed ${k.wastage}%</span></div>`; }).join('')}</div>
  <div class="toolbar"><span class="sub" style="color:var(--mute)">Every gram issued and received is recorded, so wastage and labour are clear.</span><span class="sp"></span><button class="btn pri" id="issue">Issue gold to karigar</button></div>
  <div class="tw"><table><thead><tr><th>Ref</th><th>Date</th><th>Karigar</th><th>For</th><th class="r">Issued</th><th class="r">Received</th><th class="r">Wastage</th><th>Status</th><th></th></tr></thead><tbody>
  ${S.kissue.map(i => { const k = S.karigars.find(x => x.id === i.karigar), was = i.received ? i.issued - i.recvWt : 0, allowed = i.issued * k.wastage / 100; return `<tr><td><b>${i.id}</b></td><td>${fdate(i.date)}</td><td>${esc(k.name)}</td><td>${i.order || 'Stock making'}</td><td class="r num">${g2(i.issued)} ${i.karat}</td><td class="r num">${i.received ? g2(i.recvWt) : '-'}</td><td class="r num" style="color:${was > allowed ? 'var(--bad)' : 'inherit'}">${i.received ? g2(was) + (was > allowed ? ' (over limit)' : '') : '-'}</td><td><span class="chip ${i.status === 'Open' ? 'c-warn' : 'c-ok'}">${i.status}</span></td><td>${i.status === 'Open' ? `<button class="btn sm" data-recv="${i.id}">Receive</button>` : ''}</td></tr>`; }).join('')}
  </tbody></table></div>`;
  $('#issue').onclick = () => {
    modal(`<h3>Issue gold to karigar</h3><p class="sub">Record the weight handed over. It shows on the karigar's balance until received back.</p><div class="grid2"><div class="field"><label for="ki-k">Karigar</label><select class="inp" id="ki-k">${S.karigars.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select></div><div class="field"><label for="ki-o">For order</label><select class="inp" id="ki-o"><option value="">Stock making</option>${S.orders.filter(o => o.stage !== 'Delivered').map(o => `<option>${o.id}</option>`).join('')}</select></div><div class="field"><label for="ki-w">Weight (g)</label><input class="inp num" id="ki-w" type="number" step="0.01" value="20"></div><div class="field"><label for="ki-ka">Karat</label><select class="inp" id="ki-ka"><option>22K</option><option>21K</option><option>18K</option></select></div></div><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="ki-save">Issue</button></div>`);
    $('#ki-save').onclick = () => { const w = +$('#ki-w').value || 0; if (w <= 0) return; S.kissue.unshift({ id: 'KI-' + (52 + S.kissue.length), karigar: $('#ki-k').value, date: today(), issued: w, karat: $('#ki-ka').value, order: $('#ki-o').value, received: 0, recvWt: 0, status: 'Open' }); close(); vKarigar(); toast(`${g2(w)} issued`); };
  };
  $$('[data-recv]').forEach(b => b.onclick = () => { const i = S.kissue.find(x => x.id === b.dataset.recv), k = S.karigars.find(x => x.id === i.karigar);
    modal(`<h3>Receive from ${esc(k.name)}</h3><p class="sub">Issued ${g2(i.issued)} ${i.karat}. Allowed wastage ${k.wastage}% (${g2(i.issued * k.wastage / 100)}).</p><div class="grid2"><div class="field"><label for="kr-w">Finished weight received (g)</label><input class="inp num" id="kr-w" type="number" step="0.01" value="${(i.issued * (1 - k.wastage / 100)).toFixed(2)}"></div><div class="field"><label for="kr-l">Labour (Rs)</label><input class="inp num" id="kr-l" type="number" value="${Math.round(i.issued * k.labour)}"></div></div><p id="kr-p" class="num" style="font-weight:700"></p><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="kr-save">Receive and pay labour</button></div>`);
    const p = () => { const r = +$('#kr-w').value || 0, w = i.issued - r, al = i.issued * k.wastage / 100; $('#kr-p').innerHTML = `Wastage ${g2(w)}: ${w > al ? `<span style="color:var(--bad)">${g2(w - al)} over the allowed limit, worth ${rs((w - al) * perGram('gold', i.karat))}</span>` : '<span style="color:var(--ok)">within limit</span>'}`; };
    $('#kr-w').oninput = p; p();
    $('#kr-save').onclick = () => { i.recvWt = +$('#kr-w').value || 0; i.received = 1; i.status = 'Closed'; const l = +$('#kr-l').value || 0; if (l) S.cash.push({ date: today(), desc: `Karigar labour, ${k.name} (${i.id})`, inn: 0, out: l }); const o = S.orders.find(x => x.id === i.order); if (o && o.stage === 'With karigar') o.stage = 'Ready'; close(); vKarigar(); toast('Received and recorded'); };
  });
}

/* ================= Customers ================= */
let cuQ = '';

/* ================= Cash book ================= */
function vCash() {
  let bal = 0; const rows = S.cash.map(c => { bal += c.inn - c.out; return { ...c, bal }; });
  const inn = S.cash.filter(c => c.date === today()).reduce((a, c) => a + c.inn, 0), out = S.cash.filter(c => c.date === today()).reduce((a, c) => a + c.out, 0);
  $('#page').innerHTML = `<div class="kpis"><div class="kpi"><small>Cash in today</small><b class="num" style="color:var(--ok)">${rs(inn)}</b><span>Sales, advances, khata</span></div><div class="kpi"><small>Cash out today</small><b class="num" style="color:var(--bad)">${rs(out)}</b><span>Old gold, karigar, expenses</span></div><div class="kpi"><small>Cash in hand</small><b class="num">${rs(bal)}</b><span>Should match the drawer</span></div><div class="kpi"><small>Entries</small><b class="num">${S.cash.length}</b><span>Every movement recorded</span></div></div>
  <div class="toolbar"><span class="sp"></span><button class="btn" id="exp">Add expense</button><button class="btn pri" id="close">Day closing</button></div>
  <div class="tw"><table><thead><tr><th>Date</th><th>Description</th><th class="r">In</th><th class="r">Out</th><th class="r">Balance</th></tr></thead><tbody>${rows.slice().reverse().map(r => `<tr><td>${fdate(r.date)}</td><td>${esc(r.desc)}</td><td class="r num" style="color:var(--ok)">${r.inn ? rs(r.inn) : ''}</td><td class="r num" style="color:var(--bad)">${r.out ? rs(r.out) : ''}</td><td class="r num"><b>${rs(r.bal)}</b></td></tr>`).join('')}</tbody></table></div>`;
  $('#exp').onclick = () => { modal(`<h3>Add expense</h3><div class="field"><label for="e-d">Description</label><input class="inp" id="e-d" placeholder="e.g. Shop electricity bill"></div><div class="field"><label for="e-a">Amount (Rs)</label><input class="inp num" id="e-a" type="number"></div><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="e-s">Save</button></div>`); $('#e-s').onclick = () => { const a = +$('#e-a').value || 0; if (!a) return; S.cash.push({ date: today(), desc: $('#e-d').value || 'Expense', inn: 0, out: a }); close(); vCash(); toast('Expense recorded'); }; };
  $('#close').onclick = () => modal(`<h3>Day closing</h3><p class="sub">Count the drawer and compare.</p><div class="field"><label for="cnt">Cash counted (Rs)</label><input class="inp num" id="cnt" type="number" value="${bal}"></div><p id="diff" style="font-weight:700"></p><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="cl-s">Close the day</button></div>`) || (($('#cnt').oninput = () => { const d = (+$('#cnt').value || 0) - bal; $('#diff').innerHTML = d === 0 ? '<span style="color:var(--ok)">Drawer matches the cash book.</span>' : `<span style="color:var(--bad)">Difference of ${rs(Math.abs(d))} ${d > 0 ? 'extra' : 'short'}.</span>`; })(), $('#cl-s').onclick = () => { close(); toast('Day closed. Summary sent to owner on WhatsApp (demo).'); });
}

/* ================= Reports ================= */
function vReports() {
  const days = Array.from({ length: 7 }, (_, i) => dIn(i - 6)), vals = days.map(d => S.sales.filter(s => s.date === d).reduce((a, s) => a + s.paid + (s.credit || 0), 0));
  const byCat = {}; S.sales.forEach(s => s.lines.forEach(l => { const it = S.items.find(i => i.code === l.code); const c = it ? it.cat : 'Other'; byCat[c] = (byCat[c] || 0) + l.price.total; }));
  const tot = Object.values(byCat).reduce((a, b) => a + b, 0) || 1, gSold = S.sales.reduce((a, s) => a + s.lines.filter(l => l.metal === 'gold').reduce((b, l) => b + l.net, 0), 0);
  const making = S.sales.reduce((a, s) => a + s.lines.reduce((b, l) => b + l.price.making, 0), 0), profit = S.sales.reduce((a, s) => a + s.profit, 0);
  const mx = Math.max(...vals, 1);
  $('#page').innerHTML = `<div class="kpis"><div class="kpi"><small>Sales, last 7 days</small><b class="num">${rs(vals.reduce((a, b) => a + b, 0))}</b><span>${S.sales.length} invoices</span></div><div class="kpi"><small>Gold sold</small><b class="num">${g2(gSold)}</b><span>${tmrStr(gSold)}</span></div><div class="kpi"><small>Making charges earned</small><b class="num">${rs(making)}</b><span>Labour income</span></div><div class="kpi"><small>Gross profit</small><b class="num" style="color:var(--ok)">${rs(profit)}</b><span>Sale price minus item cost</span></div></div>
  <div class="two even"><div class="panel"><h2>Daily sales</h2><p class="sub">Last 7 days.</p><svg viewBox="0 0 420 200" role="img" aria-label="Sales per day" style="width:100%;height:220px">${vals.map((v, i) => { const h = v / mx * 150, x = 16 + i * 58; return `<rect x="${x}" y="${170 - h}" width="40" height="${Math.max(h, 1)}" rx="5" fill="#732535"><title>${fdate(days[i])}: ${rs(v)}</title></rect><text x="${x + 20}" y="188" text-anchor="middle" font-size="11" fill="#77737d">${new Date(days[i]).toLocaleDateString('en-GB', { weekday: 'short' })}</text>${v ? `<text x="${x + 20}" y="${164 - h}" text-anchor="middle" font-size="10" fill="#46434b">${Math.round(v / 1000)}k</text>` : ''}`; }).join('')}</svg></div>
  <div class="panel"><h2>Sales by category</h2><p class="sub">Share of sales value.</p>${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between;font-size:13px"><b>${esc(c)}</b><span class="num">${rs(v)}</span></div><div style="height:8px;background:var(--wash);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${(v / tot * 100).toFixed(1)}%;background:var(--gold)"></i></div></div>`).join('')}</div></div>
  <div class="panel"><h2>Ready-made reports</h2><p class="sub">Each opens as a printable or Excel-ready report in the full version.</p><div class="row">${['Daily sales register', 'Stock by weight and karat', 'Old gold register', 'Karigar balance sheet', 'Khata ageing', 'Making charges report', 'Profit by item', 'Sales tax summary'].map(r => `<button class="btn" data-rep="${r}">${r}</button>`).join('')}</div></div>`;
  const comm = S.staff.filter(x => x.comm).map(x => { const ss = S.sales.filter(sa => sa.sp === x.id), v = ss.reduce((a, sa) => a + sa.paid + (sa.credit || 0), 0); return { x, n: ss.length, v, c: v * x.comm / 100 }; });
  const vend = {}; S.sales.forEach(sa => sa.lines.forEach(l => { const it = S.items.find(i => i.code === l.code); if (!it) return; const k = it.vendor; vend[k] = vend[k] || { rev: 0, cost: 0, n: 0 }; vend[k].rev += l.price.total; vend[k].cost += it.cost; vend[k].n++; }));
  const stock = S.items.filter(i => i.status === 'In stock'), buckets = [['0 to 30 days', 0, 30], ['31 to 90 days', 31, 90], ['91 to 180 days', 91, 180], ['Over 180 days', 181, 1e9]].map(([l, a, b]) => { const its = stock.filter(i => daysIn(i) >= a && daysIn(i) <= b); return { l, n: its.length, w: its.reduce((s2, i) => s2 + net(i), 0), v: its.reduce((s2, i) => s2 + itemPrice(i, true).total, 0) }; });
  $('#page').insertAdjacentHTML('beforeend', `<div class="two even" style="margin-top:14px"><div class="panel"><h2>Salesperson commission</h2><p class="sub">From invoices tagged with who made the sale.</p><div class="tw"><table><thead><tr><th>Salesperson</th><th class="r">Invoices</th><th class="r">Sales</th><th class="r">Rate</th><th class="r">Commission</th></tr></thead><tbody>${comm.map(r => `<tr><td><b>${esc(r.x.name)}</b></td><td class="r num">${r.n}</td><td class="r num">${rs(r.v)}</td><td class="r num">${r.x.comm}%</td><td class="r num"><b>${rs(r.c)}</b></td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h2>Vendor profitability</h2><p class="sub">Margin on pieces sold, by supplier.</p><div class="tw"><table><thead><tr><th>Vendor</th><th class="r">Pieces sold</th><th class="r">Sales</th><th class="r">Margin</th></tr></thead><tbody>${Object.entries(vend).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td class="r num">${v.n}</td><td class="r num">${rs(v.rev)}</td><td class="r num" style="color:var(--ok)">${rs(v.rev - v.cost)} (${((v.rev - v.cost) / v.rev * 100).toFixed(1)}%)</td></tr>`).join('')}</tbody></table></div></div></div>
  <div class="panel" style="margin-top:14px"><h2>Aging stock</h2><p class="sub">How long pieces have sat in the showroom. Old stock ties up gold and cash.</p><div class="tw"><table><thead><tr><th>Age</th><th class="r">Pieces</th><th class="r">Net weight</th><th class="r">Value at today's rate</th></tr></thead><tbody>${buckets.map(b => `<tr><td><b>${b.l}</b></td><td class="r num">${b.n}</td><td class="r num">${g2(b.w)}</td><td class="r num" style="color:${b.l.startsWith('Over') ? 'var(--bad)' : 'inherit'}">${rs(b.v)}</td></tr>`).join('')}</tbody></table></div></div>`);
  $$('[data-rep]').forEach(b => b.onclick = () => toast(`${b.dataset.rep} exported (demo)`));
}

}

function qrSvg(seedStr) { let h = 0; for (const c of seedStr) h = (h * 31 + c.charCodeAt(0)) >>> 0; const n = 25, cells = []; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { h = (h * 1103515245 + 12345) >>> 0; const corner = (x < 7 && y < 7) || (x > n - 8 && y < 7) || (x < 7 && y > n - 8); const ring = corner && (x % (n - 7) === 0 || y % (n - 7) === 0 || x === 6 || y === 6 || x === n - 1 || y === n - 1 || ((x % 18 >= 2 && x % 18 <= 4) && (y % 18 >= 2 && y % 18 <= 4))); if (corner ? ring : (h >> 16) % 2) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`); } return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" width="190" height="190" style="background:#fff;border-radius:8px"><g fill="#111">${cells.join('')}</g></svg>`; }
function qrModal(method, amt, done) {
  modal(`<h3>${method} payment</h3><p class="sub">Customer scans with any banking app. The amount and invoice are encoded (illustrative QR, demo).</p><div style="display:grid;place-items:center;gap:8px">${qrSvg(method + amt)}<b class="num" style="font-size:20px">${rs(amt)}</b><span class="chip c-warn" id="qrSt">Waiting for payment…</span></div><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn ok" id="qrOk">Payment received</button></div>`);
  $('#qrOk').onclick = () => { close(); done(); };
}

  $('#gcOk').onclick = () => { const g = S.gifts.find(x => x.code.toLowerCase() === $('#gc').value.trim().toLowerCase()); if (!g) { $('#gcE').textContent = 'No gift card with that code.'; return; } if (new Date(g.exp) < new Date(today())) { $('#gcE').textContent = 'This gift card has expired.'; return; } if (g.bal < due) { $('#gcE').textContent = `Balance is ${rs(g.bal)}. Use split payment for the rest.`; return; } close(); done(g); };

function vAudit() {
  const scope = S.items.filter(i => i.status === 'In stock' && inBranch(i));
  const a = S.audit;
  $('#page').innerHTML = `<div class="two"><div class="panel"><h2>Stock audit</h2><p class="sub">Wave the RFID reader over trays, or scan barcodes one by one. Every tag found is ticked off against the system.</p>
    <div class="row"><button class="btn pri" id="aStart">${a && a.running ? 'Scanning…' : 'Start RFID sweep'}</button><input class="inp" id="aScan" placeholder="Or type / scan a tag code and press Enter" style="max-width:300px" aria-label="Scan tag"></div>
    ${a ? `<div style="margin-top:14px"><div class="row" style="justify-content:space-between"><b>${a.found.length} of ${scope.length} found</b><span class="num">${Math.round(a.found.length / Math.max(1, scope.length) * 100)}%</span></div><div style="height:10px;background:var(--wash);border-radius:6px;overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:${a.found.length / Math.max(1, scope.length) * 100}%;background:var(--ok)"></i></div></div>` : ''}
    <div class="tw" style="margin-top:12px;max-height:420px;overflow-y:auto"><table><thead><tr><th>Code</th><th>Item</th><th class="r">Net</th><th>Result</th></tr></thead><tbody>${scope.map(i => { const f = a && a.found.includes(i.code); return `<tr><td><b>${i.code}</b></td><td>${esc(i.name)}</td><td class="r num">${g2(net(i))}</td><td>${a ? (f ? '<span class="chip c-ok">Found</span>' : a.running ? '<span class="chip">Waiting</span>' : '<span class="chip c-bad">Missing</span>') : '<span class="chip">Not scanned</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>
    <div class="panel"><h2>Audit result</h2><p class="sub">What a full audit tells the owner.</p>${a && !a.running ? `<div class="break" style="font-size:14px"><span>Expected pieces</span><span class="r num">${scope.length}</span><span>Found</span><span class="r num" style="color:var(--ok)">${a.found.length}</span><span>Missing</span><span class="r num" style="color:var(--bad)">${scope.length - a.found.length}</span><span>Missing gold weight</span><span class="r num">${g2(scope.filter(i => !a.found.includes(i.code)).reduce((s, i) => s + net(i), 0))}</span><span>Missing value at today's rate</span><span class="r num">${rs(scope.filter(i => !a.found.includes(i.code)).reduce((s, i) => s + itemPrice(i, true).total, 0))}</span><span>Time taken</span><span class="r num">${a.secs} seconds</span></div><p class="sub" style="margin-top:12px">Missing pieces in this demo are random. In a real shop, a missing piece is usually on a tray in another counter, on memo, or with the karigar.</p><button class="btn" id="aRep">Export audit report</button>` : '<p class="sub">Start a sweep to see the result.</p>'}</div></div>`;
  $('#aStart').onclick = () => { if (S.audit && S.audit.running) return; S.audit = { running: true, found: [], secs: 0 }; const order = scope.map(i => i.code).sort(() => Math.random() - .5), miss = order.slice(0, Math.max(1, Math.round(order.length * .08))); const t0 = Date.now(); let k = 0; const tick = setInterval(() => { if (view !== 'audit') { clearInterval(tick); S.audit.running = false; return; } const c = order[k++]; if (c && !miss.includes(c)) S.audit.found.push(c); if (k >= order.length) { clearInterval(tick); S.audit.running = false; S.audit.secs = Math.max(1, Math.round((Date.now() - t0) / 1000)); toast(`Audit done: ${S.audit.found.length} of ${scope.length} found`); } vAudit(); }, 160); };
  $('#aScan').onkeydown = e => { if (e.key !== 'Enter') return; const c = e.target.value.trim().toUpperCase(); if (!S.audit) S.audit = { running: false, found: [], secs: 0 }; if (scope.some(i => i.code === c)) { if (!S.audit.found.includes(c)) S.audit.found.push(c); toast(`${c} found`); } else toast(`${c} is not in this stock list`); vAudit(); $('#aScan').focus(); };
  if ($('#aRep')) $('#aRep').onclick = () => toast('Audit report exported (demo)');
}

  $$('[data-redeem]').forEach(b => b.onclick = () => { const c = S.customers.find(x => x.id === b.dataset.redeem), v = c.points * 10; c.credit = (c.credit || 0) + v; c.points = 0; vPlans(); toast(`${rs(v)} added to ${c.name}'s store credit`); });
  if ($('#newGs')) $('#newGs').onclick = () => { modal(`<h3>Enrol in gold savings</h3><p class="sub">Fixed monthly amount for 11 months.</p><div class="field"><label for="gs-c">Customer</label><select class="inp" id="gs-c">${S.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label for="gs-m">Monthly amount (Rs)</label><input class="inp num" id="gs-m" type="number" value="25000"></div><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="gs-s">Enrol and take first instalment</button></div>`); $('#gs-s').onclick = () => { const m = +$('#gs-m').value || 0; if (!m) return; const id = 'GS-' + (9 + S.plans.length); S.plans.push({ id, type: 'Gold savings', cust: $('#gs-c').value, monthly: m, months: 11, paidMonths: 1, start: today(), next: dIn(30) }); S.cash.push({ date: today(), desc: `Gold savings ${id} first instalment`, inn: m, out: 0 }); close(); vPlans(); toast(`${id} started`); }; };
  if ($('#newGc')) $('#newGc').onclick = () => { modal(`<h3>Sell a gift card</h3><div class="grid2"><div class="field"><label for="g-v">Value (Rs)</label><input class="inp num" id="g-v" type="number" value="20000"></div><div class="field"><label for="g-t">For</label><input class="inp" id="g-t" placeholder="Recipient name"></div></div><div class="mact"><button class="btn" data-x>Cancel</button><button class="btn pri" id="g-s">Issue gift card</button></div>`); $('#g-s').onclick = () => { const v = +$('#g-v').value || 0; if (!v) return; const code = 'GC-' + (5823 + S.gifts.length); S.gifts.unshift({ code, value: v, bal: v, to: $('#g-t').value || 'Gift', exp: dIn(365) }); S.cash.push({ date: today(), desc: `Gift card ${code} sold`, inn: v, out: 0 }); close(); vPlans(); toast(`${code} issued. Card printed and sent on WhatsApp (demo).`); }; };
}

document.addEventListener('click', e => { const b = e.target.closest('[data-cert]'); if (!b) return; const it = S.items.find(i => i.code === b.dataset.cert), s = it.stones[0] || {};
  modal(`<h3>Certificate, ${it.code}</h3><p class="sub">${esc(it.name)}</p><div class="break" style="font-size:14px"><span>Lab</span><span class="r">${esc(s.lab || '-')}</span><span>Certificate no.</span><span class="r">${esc(s.cert || '-')}</span>${s.ct ? `<span>Carat weight</span><span class="r num">${s.ct} ct</span>` : ''}<span>Cut / shape</span><span class="r">${esc(s.cut || '-')}</span><span>Colour</span><span class="r">${esc(s.color || '-')}</span><span>Clarity</span><span class="r">${esc(s.clarity || '-')}</span>${s.perCt ? `<span>Price per carat</span><span class="r num">${rs(s.perCt)}</span>` : ''}</div><p class="sub" style="margin-top:12px">A scan of the lab certificate is attached to the item in the full version, and printed with the invoice.</p><div class="mact"><button class="btn pri" data-x>Close</button></div>`); });

go('dash');
</script>
</body>
</html>
