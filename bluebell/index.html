<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Bluebell Flower Boutique, Al Wafi, Oman: bouquets, flower boxes and arrangements. Website prototype by Zynvox.">
<link rel="icon" href="/favicon.ico">
<title>Bluebell Flowers | Prototype by Zynvox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --primary:#c8102e; --primary-hover:#a30d25; --on-primary:#fff; --primary-soft:#fde8ec; --primary-line:#f5c2cc;
  --canvas:#ffffff; --parchment:#f5f5f7; --tile:#f8f9fa;
  --nav:#121214; --nav-ink:#ffffff;
  --ink:#0f172a; --ink-soft:#334155; --muted:#64748b;
  --hairline:#e2e8f0; --err:#b91c1c; --wa:#25D366; --wa-hover:#1EBE5A; --wa-ink:#ffffff;
  --shadow:3px 5px 30px 0 rgba(0,0,0,.12);
  --font:-apple-system, BlinkMacSystemFont, 'Inter', 'Tajawal', system-ui, 'Segoe UI', sans-serif;
  color-scheme:light;
}
html[lang="ar"]{--font:'Tajawal', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif}
*{box-sizing:border-box}
html,body{background:var(--canvas);margin:0}
body{color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.374px;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{letter-spacing:0}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1024px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button{font:inherit;letter-spacing:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--font);text-wrap:balance;margin:0;letter-spacing:-.02em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{letter-spacing:0}
.proto{background:var(--parchment);color:var(--muted);font-size:12px;text-align:center;padding:6px 16px;letter-spacing:-.12px}

header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-ink)}
.hbar{display:flex;align-items:center;gap:20px;height:52px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--nav-ink);font-size:17px;font-weight:600;flex:none}
.logo img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.25)}
nav.main{display:flex;gap:28px;font-size:12px;flex:1;justify-content:flex-end}
nav.main a{text-decoration:none;color:var(--nav-ink);opacity:.88}
nav.main a:hover{opacity:1}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.lang,.cartbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--nav-ink);border-radius:9999px;height:32px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.cartbtn .n{background:var(--primary);color:var(--on-primary);border-radius:9999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
@media (max-width:760px){nav.main{display:none}}

.hero{text-align:center}
.hero .wrap{padding-block:40px 32px;display:flex;flex-direction:column;align-items:center}
.eyebrow{font-size:clamp(16px,2.4vw,20px);font-weight:600;color:var(--primary)}
.hero h1{font-size:clamp(34px,6.4vw,56px);line-height:1.1;font-weight:700;margin:8px 0 14px;max-width:16ch}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero p{color:var(--muted);font-size:clamp(17px,2.2vw,21px);max-width:40ch;margin:0 0 22px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{border-radius:9999px;min-height:44px;padding:11px 22px;font-size:17px;font-weight:400;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.red{background:var(--primary);color:var(--on-primary)}
.btn.red:hover{background:var(--primary-hover)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:10px 21px}
.btn.wa{background:var(--wa);color:var(--wa-ink)!important;font-weight:600}
.btn.wa:hover{background:var(--wa-hover)}
.wa-ic{width:20px;height:20px;flex:none}
.heroimg{position:relative;border-radius:18px;overflow:hidden;width:100%;max-width:720px;aspect-ratio:16/10;margin-top:32px;box-shadow:var(--shadow);border:1px solid var(--hairline)}
.heroimg img{width:100%;height:100%;object-fit:cover;display:block}
.heroimg .tag{position:absolute;inset-inline-start:12px;bottom:12px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:12px;padding:8px 12px;text-align:start}
.heroimg .tag b{display:block;font-size:15px;font-weight:600}
.heroimg .tag span{font-size:12px;color:var(--muted)}

.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px auto 0}
.trust div{background:var(--tile);border:1px solid var(--hairline);border-radius:18px;padding:16px;font-size:14px;color:var(--muted);min-width:0}
.trust b{display:block;color:var(--ink);font-size:15px;font-weight:600}
@media (max-width:560px){.trust{grid-template-columns:1fr}}

section.shop{padding-block:40px 48px}
.shophead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.shophead h2{font-size:clamp(28px,4vw,40px);font-weight:700}
.count{color:var(--muted);font-size:14px}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.frow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flabel{font-size:12px;color:var(--muted);font-weight:600;align-self:center;flex:none;margin-inline-end:2px}
.chip{flex:none;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:9999px;padding:8px 16px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{border:2px solid var(--primary);padding:7px 15px;color:var(--primary)}
.sort{border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:9999px;padding:8px 14px;font:inherit;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .ph{position:relative;aspect-ratio:1/1;background:var(--parchment);border:0;padding:0;display:block;width:100%}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:#fff;color:var(--primary);border:1px solid var(--primary-line);font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card .type{font-size:12px;color:var(--muted)}
.card h3{font-weight:600;font-size:16px;line-height:1.3}
.price{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;margin-top:auto}
.card .acts{display:grid;grid-template-columns:1fr auto;gap:6px}
.card .add{background:var(--primary);color:var(--on-primary);border:0;border-radius:9999px;padding:9px 10px;font-size:14px}
.card .add:hover{background:var(--primary-hover)}
.card .view{background:transparent;color:var(--primary);border:1px solid var(--primary);border-radius:9999px;padding:8px 14px;font-size:14px}
@media (max-width:560px){.card .acts{grid-template-columns:1fr}.card .view{display:none}.card .add{padding:10px}}

.custom{background:var(--primary-soft);border:1px solid var(--primary-line);border-radius:18px;padding:20px;margin-top:20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.custom h3{font-size:19px;font-weight:700}
.custom p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}

.infoband{background:var(--parchment)}
.info{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding-block:40px}
.panel{background:var(--canvas);border:1px solid var(--hairline);border-radius:18px;padding:24px;min-width:0}
.panel h2{font-size:24px;font-weight:700;margin-bottom:8px}
.panel p{color:var(--muted);margin:0 0 10px}
.steps{display:grid;gap:12px;margin-top:8px}
.steps div{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;color:var(--ink-soft)}
.steps i{font-style:normal;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--primary);color:var(--primary);display:grid;place-items:center;font-size:14px;font-weight:600}
.num{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hours{list-style:none;padding:0;margin:4px 0 14px;display:grid;gap:4px;font-size:15px}
.hours li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--hairline);padding-bottom:4px}
.hours li span:last-child{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:760px){.info{grid-template-columns:1fr}}
footer{background:var(--parchment);border-top:1px solid var(--hairline);padding-block:18px 90px;color:var(--muted);font-size:12px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--wa);color:var(--wa-ink);font-weight:600;border-radius:9999px;padding:12px 18px;font-size:15px;text-decoration:none;box-shadow:var(--shadow);display:inline-flex;gap:8px;align-items:center}
.fab:hover{background:var(--wa-hover)}

.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40}
.sheet{position:fixed;z-index:50;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:92%;overflow:auto;background:var(--canvas);border-radius:18px 18px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .pimg{aspect-ratio:1/1;max-height:420px;background:var(--parchment);overflow:hidden}
.sheet .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .in{padding:18px;display:grid;gap:10px}
.sheet h2{font-size:26px;font-weight:700}
.qty{display:flex;align-items:center;border:1px solid var(--hairline);border-radius:9999px;overflow:hidden;width:max-content}
.qty button{width:38px;height:38px;border:0;background:var(--canvas);color:var(--primary);font-size:18px}
.qty span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.close{position:absolute;inset-inline-end:12px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:20px;box-shadow:var(--shadow)}
.drawer{position:fixed;z-index:50;top:0;inset-inline-end:0;height:100%;width:min(420px,100%);background:var(--canvas);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--hairline)}
.dh h2{font-size:21px;font-weight:700}
.dbody{flex:1;overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center}
.line img{width:64px;height:64px;border-radius:11px;object-fit:cover}
.line .t{font-weight:600;font-size:14px;line-height:1.25}
.line .p{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.rm{border:0;background:none;color:var(--primary);font-size:12px;padding:0}
.dfoot{border-top:1px solid var(--hairline);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
form.co{display:grid;gap:8px}
form.co label{font-size:12px;font-weight:600;color:var(--muted)}
form.co input,form.co textarea,form.co select{width:100%;border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);border-radius:11px;padding:10px 12px;font:inherit;font-size:16px}
form.co input:focus,form.co textarea:focus,form.co select:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--hairline);background:var(--canvas);border-radius:11px;padding:10px;font-size:15px;color:var(--ink)}
.seg button[aria-pressed="true"]{border:2px solid var(--primary);color:var(--primary);padding:9px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.done{background:var(--tile);border:1px solid var(--hairline);border-radius:11px;padding:12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}}
</style>
</head>

      <button class="ph" data-view="${p.id}" aria-label="${nm(p)}"><img src="${p.img}" alt="${nm(p)}" loading="lazy"><span class="badge">${t().types[p.type]}</span></button>
      <div class="body">
        <div class="type">${p.occ.map(o => t().occs[o]).join(' · ')}</div>
        <h3>${nm(p)}</h3>
        <div class="price">${t().cur(p.price)}</div>
        <div class="acts"><button class="add" data-add="${p.id}">${t().add}</button><button class="view" data-view="${p.id}">${t().view}</button></div>
      </div>
    </article>`).join('') : `<p class="empty">${t().none}</p>`;
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-add]'); if (a) { add(a.dataset.add, 1); const o = a.textContent; a.textContent = t().added; setTimeout(() => a.textContent = o, 1100); }
  const v = e.target.closest('[data-view]'); if (v) openSheet(v.dataset.view);
});
function add(id, q) { cart[id] = (cart[id] || 0) + q; if (cart[id] <= 0) delete cart[id]; save(); updateCount(); if (!$('#drawer').hidden) drawCart(); }
function updateCount() { $('#cartCount').textContent = Object.values(cart).reduce((a, b) => a + b, 0); }

let sq = 1;
function openSheet(id) {
  const p = products.find(x => x.id === id); sq = 1;
  const s = $('#sheet');
  s.innerHTML = `<div style="position:relative"><div class="pimg"><img src="${p.img}" alt="${nm(p)}"></div><button class="close" id="sClose" aria-label="Close">×</button></div>
    <div class="in">
      <div style="font-size:13px;color:var(--muted)">${t().types[p.type]} · ${p.occ.map(o => t().occs[o]).join(' · ')}</div>
      <h2 id="sTitle">${nm(p)}</h2>
      <div class="price" style="font-size:24px">${t().cur(p.price)}</div>
      <p style="margin:0;color:var(--muted)">${p[L][1]}</p>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="qty"><button id="qm" aria-label="−">−</button><span id="qv">1</span><button id="qp" aria-label="+">+</button></div>
        <button class="btn red" id="sAdd" style="flex:1">${t().add}</button>
      </div>
      <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(t().ask(nm(p)))}">${WAI}<span>${t().askBtn}</span></a>
    </div>`;
  show(s);
  $('#sClose').onclick = closeAll;
  $('#qm').onclick = () => { sq = Math.max(1, sq - 1); $('#qv').textContent = sq; };
  $('#qp').onclick = () => { sq++; $('#qv').textContent = sq; };
  $('#sAdd').onclick = () => { add(p.id, sq); closeAll(); openCart(); };
}
function show(el) { $('#scrim').hidden = false; el.hidden = false; document.body.style.overflow = 'hidden'; }
function closeAll() { ['#scrim', '#sheet', '#drawer'].forEach(s => $(s).hidden = true); document.body.style.overflow = ''; }
$('#scrim').onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
$('#openCart').onclick = openCart; $('#closeCart').onclick = closeAll;

function openCart() { drawCart(); show($('#drawer')); }
const keep = {};
function drawCart() {
  ['cName','cPhone','cArea','cDate','cTo','cCard'].forEach(k => { const el = document.getElementById(k); if (el) keep[k] = el.value; });
  const ids = Object.keys(cart);
  if (!ids.length) { $('#dbody').innerHTML = `<p class="empty">${t().empty}</p>`; $('#dfoot').innerHTML = `<button class="btn red" id="goShop">${t().browse}</button>`; $('#goShop').onclick = () => { closeAll(); location.hash = 'shop'; }; return; }
  let total = 0;
  const today = new Date().toISOString().slice(0, 10);
  $('#dbody').innerHTML = ids.map(id => { const p = products.find(x => x.id === id); const q = cart[id]; total += p.price * q;
    return `<div class="line"><img src="${p.img}" alt=""><div><div class="t">${nm(p)}</div><div class="p">${t().cur(p.price)} × ${q}</div><button class="rm" data-rm="${id}">✕</button></div>
      <div class="qty"><button data-q="${id}" data-d="-1" aria-label="−">−</button><span>${q}</span><button data-q="${id}" data-d="1" aria-label="+">+</button></div></div>`; }).join('') +
    `<form class="co" id="co" novalidate>
      <label for="cName">${t().fName}</label><input id="cName" autocomplete="name">
      <label for="cPhone">${t().fPhone}</label><input id="cPhone" inputmode="tel" autocomplete="tel">
      <label>${t().fHow}</label><div class="seg"><button type="button" data-m="del" aria-pressed="${mode === 'del'}">${t().del}</button><button type="button" data-m="pick" aria-pressed="${mode === 'pick'}">${t().pick}</button></div>
      <div id="areaWrap" ${mode === 'pick' ? 'hidden' : ''} style="display:grid;gap:8px"><label for="cArea">${t().fArea}</label><input id="cArea" autocomplete="street-address"></div>
      <label for="cDate">${t().fDate}</label><input id="cDate" type="date" min="${today}">
      <label for="cTo">${t().fTo}</label><input id="cTo">
      <label for="cCard">${t().fCard}</label><textarea id="cCard" rows="2"></textarea>
    </form><div id="coMsg"></div>`;
  Object.entries(keep).forEach(([k, v]) => { const el = document.getElementById(k); if (el && v) el.value = v; });
  $('#dfoot').innerHTML = `<div class="tot"><span>${t().total}</span><span>${t().cur(total)}</span></div><button class="btn wa" id="send">${WAI}<span>${t().send}</span></button>`;
  $('#dbody').querySelectorAll('[data-q]').forEach(b => b.onclick = () => add(b.dataset.q, +b.dataset.d));
  $('#dbody').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { delete cart[b.dataset.rm]; save(); updateCount(); drawCart(); });
  $('#dbody').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; $('#dbody').querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#areaWrap').hidden = mode === 'pick'; });
  $('#send').onclick = () => sendOrder(total);
}
function sendOrder(total) {
  const v = id => (document.getElementById(id) || {}).value?.trim() || '';
  const n = v('cName'), ph = v('cPhone'), ar = v('cArea'), dt = v('cDate'), to = v('cTo'), cd = v('cCard');
  if (!n || !ph || !dt || (mode === 'del' && !ar)) { $('#coMsg').innerHTML = `<p style="color:var(--err);font-weight:600;margin:0">${t().missing}</p>`; return; }
  const M = t().msg;
  const lines = Object.keys(cart).map(id => { const p = products.find(x => x.id === id); return `• ${nm(p)} × ${cart[id]} = ${t().cur(p.price * cart[id])}`; });
  const msg = `${M.hi}\n${lines.join('\n')}\n${M.total}: ${t().cur(total)}\n\n${M.name}: ${n}\n${M.phone}: ${ph}\n${M.how}: ${mode === 'del' ? t().del : t().pick}${mode === 'del' ? '\n' + M.area + ': ' + ar : ''}\n${M.date}: ${dt}${to ? '\n' + M.to + ': ' + to : ''}${cd ? '\n' + M.card + ': ' + cd : ''}`;
  $('#coMsg').innerHTML = `<p style="margin:0 0 6px;font-weight:700">${t().ready}</p><div class="done" id="msgTxt"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">${WAI}<span>${t().open}</span></a><button class="btn ghost" id="copy">${t().copy}</button></div>
    <p style="font-size:12px;color:var(--muted);margin:8px 0 0">${t().fallback}</p>`;
  $('#msgTxt').textContent = msg;
  $('#copy').onclick = () => { const b = $('#copy'); navigator.clipboard.writeText(msg).then(() => b.textContent = t().copied).catch(() => { const r = document.createRange(); r.selectNodeContents($('#msgTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = t().selected; }); };
  $('#coMsg').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
applyLang(); updateCount();
</script>
</body>
</html>
